<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">ios-dodge</title>
  <desc id="desc">iOS 16.5, iOS 19.0 and iOS 27.2 on OnePlus 13. A white turtle on a dark background with red accents.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#160e12"/>
      <stop offset="1" stop-color="#10090c"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#ef4444" stop-opacity=".13"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x2=".7" y2="1">
      <stop stop-color="#fff7f7"/>
      <stop offset="1" stop-color="#ecc4c6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c99194" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="bounds"><rect width="1120" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1120" height="360" fill="url(#background)"/>
    <rect width="1120" height="360" fill="url(#grid)"/>
    <ellipse cx="884" cy="175" rx="260" ry="250" fill="url(#halo)"/>
    <path d="M0 359H1120" stroke="#ef4444" stroke-opacity=".25"/>
    <g fill="none" stroke="#ef4444">
      <circle cx="895" cy="180" r="128" stroke-opacity=".13"/>
      <circle cx="895" cy="180" r="149" stroke-opacity=".065" stroke-dasharray="3 9"/>
      <path d="M744 180h9m284 0h9M895 29v9m0 284v9" stroke-opacity=".35"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <circle cx="57" cy="54" r="4" fill="#ff666d"/>
      <text x="71" y="59" font-size="12" font-weight="600" letter-spacing="2.5" fill="#c4b0b1">EXPERIMENTAL · RAM ONLY</text>
      <text x="50" y="159" font-size="82" font-weight="750" letter-spacing="-4" fill="#fbf5f5">ios-dodge</text>
      <text x="54" y="204" font-size="23" letter-spacing="-.3" fill="#d0bfc0">iOS on OnePlus 13.</text>
      <text x="54" y="235" font-size="15" fill="#ab8e90">XNU · Adreno 830 · UEFI</text>
      <g transform="translate(54 276)" font-size="12" font-weight="600">
        <rect width="97" height="31" rx="8" fill="#29161a" stroke="#593036"/>
        <text x="48.5" y="20" text-anchor="middle" fill="#ffaaaa">iOS 16.5</text>
        <rect x="108" width="97" height="31" rx="8" fill="#29161a" stroke="#593036"/>
        <text x="156.5" y="20" text-anchor="middle" fill="#ffaaaa">iOS 19.0</text>
        <rect x="216" width="97" height="31" rx="8" fill="#29161a" stroke="#593036"/>
        <text x="264.5" y="20" text-anchor="middle" fill="#ffaaaa">iOS 27.2</text>
        <rect x="324" width="109" height="31" rx="8" fill="#1d1418" stroke="#423036"/>
        <text x="378.5" y="20" text-anchor="middle" fill="#d3c0c3">SM8750</text>
        <rect x="444" width="119" height="31" rx="8" fill="#1d1418" stroke="#423036"/>
        <text x="503.5" y="20" text-anchor="middle" fill="#d3c0c3">GLES 3.2</text>
      </g>
    </g>
