      <path d="M154 128L142 125L123 158L136 183C148 171 154 150 154 128Z"/>
      <path d="M83 165H117L131 190L110 204L100 218L90 204L69 190Z"/>
      <path d="M55 188L76 205L49 229C34 213 41 195 55 188Z"/>
